# VaxiCare Database Configuration
# KTU S3 Java OOP Project

# Database Type: mysql or sqlite (fallback)
db.type=mysql

# MySQL Settings
db.mysql.driver=com.mysql.cj.jdbc.Driver
db.mysql.url=jdbc:mysql://localhost:3306/vaxicare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.user=root
db.mysql.password=root

# SQLite Fallback Settings (Zero-configuration file database for offline Viva demo)
db.sqlite.driver=org.sqlite.JDBC
db.sqlite.url=jdbc:sqlite:vaxicare_local.db
